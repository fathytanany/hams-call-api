services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: callapi
      POSTGRES_PASSWORD: callapi
      POSTGRES_DB: callapi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "callapi"]
      interval: 1s
      timeout: 3s
      retries: 30

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://callapi:callapi@db:5432/callapi
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./media:/app/media:ro

  # The demo app the API dials (scripts/demo.py points calls at ws://testapp:8765).
  testapp:
    build: .
    command: ["/app/.venv/bin/python", "-m", "callapi.testapp"]
    environment:
      OUT_DIR: /app/out
    volumes:
      - ./out:/app/out
