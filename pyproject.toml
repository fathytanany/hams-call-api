[project]
name = "callapi"
version = "0.1.0"
description = "Twilio-compatible Call API that streams WAV files to apps over Media Streams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "audioop-lts; python_version >= '3.13'",
    "fastapi",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# audioop is deprecated in 3.12's stdlib; 3.13+ gets the same module from audioop-lts.
filterwarnings = ["ignore:'audioop' is deprecated:DeprecationWarning"]
